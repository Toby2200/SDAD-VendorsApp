<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo</title>
</head>
<body>

    <h2>Catálogo de Productos</h2>

    <form id="catalogForm" method="POST" action="{{ url_for('catalog.products') }}">
        <table>
            <thead>
                <tr>
                    <th>Elegir</th>
                    <th>Código</th>
                    <th>Descripción</th>
                    <th>Precio</th>
                    <th>Disponible</th>
                    <th>Cantidad</th>
                </tr>
            </thead>
            <tbody>
                {% for product in products %}
                <tr>
                    <td>
                        <input 
                            type="checkbox" 
                            name="selected_products" 
                            value="{{ product['id_product'] }}"
                            data-price="{{ product['price'] }}"
                            onchange="updateFloatingBar()"
                        >
                    </td>
                    <td><strong>{{ product['code'] }}</strong></td>
                    <td>{{ product['description'] }}</td>
                    <td>${{ "%.2f"|format(product['price']) }}</td>
                    <td>{{ product['quantity'] }}</td>
                    <td>
                        <input 
                            type="number" 
                            name="quantity_{{ product['id_product'] }}" 
                            id="qty_{{ product['id_product'] }}"
                            min="1" 
                            max="{{ product['quantity'] }}" 
                            value="1"
                            data-max-stock="{{ product['quantity'] }}"
                            oninput="validateAndRecalculate(this)"
                        >
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <!-- Barra Flotante Inferior -->
        <div class="sticky-cart-bar">
            <div>
                <span id="itemCount" style="font-size: 1.1em; font-weight: bold;">0 productos seleccionados</span>
            </div>
            <div>
                <span style="margin-right: 15px; font-size: 1.2em;">Total: <strong id="cartTotal">$0.00</strong></span>
                <button type="submit" id="viewCartBtn" class="cart-btn" disabled>Ver Carrito</button>
            </div>
        </div>
    </form>

    <script>
        function validateAndRecalculate(input) {
            const maxStock = parseInt(input.dataset.maxStock, 10);
            let val = parseInt(input.value, 10);

            if (isNaN(val) || val < 1) {
                input.value = 1;
            } else if (val > maxStock) {
                input.value = maxStock;
            }

            updateFloatingBar();
        }

        function updateFloatingBar() {
            const checkboxes = document.querySelectorAll('input[name="selected_products"]:checked');
            let total = 0;
            let count = 0;

            checkboxes.forEach(cb => {
                const prodId = cb.value;
                const price = parseFloat(cb.getAttribute('data-price')) || 0;
                const qtyInput = document.getElementById('qty_' + prodId);
                const qty = parseInt(qtyInput.value, 10) || 1;

                total += price * qty;
                count += qty;
            });

            document.getElementById('itemCount').textContent = count + (count === 1 ? " producto seleccionado" : " productos seleccionados");
            document.getElementById('cartTotal').textContent = "$" + total.toFixed(2);
            document.getElementById('viewCartBtn').disabled = (count === 0);
        }
    </script>
</body>
</html>
