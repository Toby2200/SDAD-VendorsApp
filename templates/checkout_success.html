<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido Confirmado</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('catalog.products') }}">Vendors App</a>
        </div>
    </nav>

    <!-- Contenido principal -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6 text-center">
                
                <div class="card shadow-sm border-0 rounded-4 p-4">
                    <div class="card-body">
                        
                        <div class="mb-3 text-success">
                            <svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" fill="currentColor" class="bi bi-check-circle-fill" viewBox="0 0 16 16">
                                <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l5-5.25a.75.75 0 0 0-.02-1.06z"/>
                            </svg>
                        </div>

                        <h2 class="fw-bold text-dark mb-1">¡Pedido Registrado con Éxito!</h2>
                        <p class="text-muted mb-4">La orden se ha guardado correctamente y el inventario fue actualizado.</p>

                        <div class="bg-light rounded-3 p-3 mb-4 text-start">
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-muted">Número de Orden:</span>
                                <span class="fw-bold text-primary">#{{ sale_id }}</span>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <a href="{{ url_for('catalog.products') }}" class="btn btn-primary btn-lg rounded-3 fw-semibold">
                                Volver al Catálogo
                            </a>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
